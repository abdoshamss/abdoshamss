<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 256" width="1200" height="256" role="img" aria-label="Career timeline">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02569B"/><stop offset="0.5" stop-color="#0175C2"/><stop offset="1" stop-color="#36BCF7"/>
    </linearGradient>
    <pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.6" cy="1.6" r="1.1" fill="#161D28"/></pattern>
    <style>
      text { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; text-anchor:middle; }
      .date { font-size:12px; fill:#36BCF7; letter-spacing:1.4px; font-weight:700; }
      .role { font-size:13.5px; fill:#E6EDF3; font-weight:600; }
      .co   { font-size:11.5px; fill:#6E7681; }
      .ttl  { font-size:17px; letter-spacing:3.4px; fill:#36BCF7; font-weight:700; text-anchor:start; }
      .pulse { animation: pl 2.4s ease-out infinite; transform-origin:center; transform-box:fill-box; }
      @keyframes pl { 0%{transform:scale(1);opacity:.9} 100%{transform:scale(2.6);opacity:0} }
    </style>
  </defs>
  <rect width="1200" height="256" rx="14" fill="#0D1117"/>
  <rect width="1200" height="256" rx="14" fill="url(#d)"/>
  <rect width="1200" height="256" rx="14" fill="none" stroke="#1B2431"/>
  <rect x="42" y="30" width="5" height="20" rx="2.5" fill="url(#ac)"/>
  <text class="ttl" x="60" y="46">CAREER TIMELINE</text>
  <rect x="110" y="136.75" width="980" height="2.5" rx="1.25" fill="url(#ac)"/>
  <g>
    <line x1="110" y1="138" x2="110" y2="110" stroke="#22384F" stroke-width="1.5"/>
    <circle cx="110" cy="138" r="6" fill="#0D1117" stroke="#36BCF7" stroke-width="2"/>
    <text class="date" x="110" y="70">09/2023</text>
    <text class="role" x="110" y="86">Internship</text>
    <text class="co"   x="110" y="102">Al Almiya Alhura</text>
  </g>
  <g>
    <line x1="355" y1="138" x2="355" y2="166" stroke="#22384F" stroke-width="1.5"/>
    <circle cx="355" cy="138" r="6" fill="#0D1117" stroke="#36BCF7" stroke-width="2"/>
    <text class="date" x="355" y="180">09/2024</text>
    <text class="role" x="355" y="196">Flutter Developer</text>
    <text class="co"   x="355" y="212">Almasader Alraqmia</text>
  </g>
  <g>
    <line x1="600" y1="138" x2="600" y2="110" stroke="#22384F" stroke-width="1.5"/>
    <circle cx="600" cy="138" r="6" fill="#0D1117" stroke="#36BCF7" stroke-width="2"/>
    <text class="date" x="600" y="70">07/2025</text>
    <text class="role" x="600" y="86">Head + Instructor</text>
    <text class="co"   x="600" y="102">Breakin Point Team</text>
  </g>
  <g>
    <line x1="845" y1="138" x2="845" y2="166" stroke="#22384F" stroke-width="1.5"/>
    <circle cx="845" cy="138" r="6" fill="#0D1117" stroke="#36BCF7" stroke-width="2"/>
    <text class="date" x="845" y="180">09/2025</text>
    <text class="role" x="845" y="196">Flutter Developer</text>
    <text class="co"   x="845" y="212">Sub Code</text>
  </g>
  <g>
    <line x1="1090" y1="138" x2="1090" y2="110" stroke="#22384F" stroke-width="1.5"/>
    <circle cx="1090" cy="138" r="8" fill="#36BCF7" stroke="#36BCF7" stroke-width="2"/>
    <circle cx="1090" cy="138" r="8" fill="none" stroke="#36BCF7" stroke-width="1.5" class="pulse"/>
    <text class="date" x="1090" y="70">04/2026</text>
    <text class="role" x="1090" y="86">Flutter Developer</text>
    <text class="co"   x="1090" y="102">Al Almiya Alhura</text>
  </g>
</svg>